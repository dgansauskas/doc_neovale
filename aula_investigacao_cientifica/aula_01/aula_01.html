<header>Investigação Científica e Tecnológica | Aula Integrada</header>
<h1 id="1-estudo-de-caso-guia-o-problema-de-ia">1. Estudo de Caso Guia: O Problema de IA</h1>
<h3 id="o-desafio-corporativo">O Desafio Corporativo</h3>
<blockquote>
<p>Uma empresa do setor financeiro lançou um assistente baseado em IA Generativa para atendimento. Em poucas semanas, o sistema apresentou respostas incorretas sobre taxas (<em>alucinação</em>) e recusa indevida de crédito para certos perfis (<em>viés</em>).</p>
</blockquote>
<h3 id="a-condu%C3%A7%C3%A3o-cient%C3%ADfica-vs-empirismo">A Condução Científica vs. Empirismo</h3>
<ul>
<li data-marpit-fragment="1"><strong>Tentativa Errada:</strong> Alterar código e <em>prompts</em> aleatoriamente sem saber o que está causando o erro.</li>
<li data-marpit-fragment="2"><strong>Abordagem Metodológica:</strong> Definir <strong>O QUE</strong> investigar (Objetivo), <strong>QUAL</strong> a natureza dos dados (Abordagem) e <strong>COMO</strong> coletar evidências (Delineamento).</li>
</ul>
<footer>Tipos, Abordagens e Delineamentos de Pesquisa</footer>

<h1 id="2-tipos-de-pesquisa-quanto-aos-objetivos">2. Tipos de Pesquisa quanto aos Objetivos</h1>
<h3 id="%F0%9F%94%8D-1-pesquisa-explorat%C3%B3ria"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> 1. Pesquisa Exploratória</h3>
<ul>
<li data-marpit-fragment="1"><strong>Conceito:</strong> Utilizada quando o tema é novo, pouco documentado ou quando não se entende bem o fenômeno.</li>
<li data-marpit-fragment="2"><strong>Foco em IA:</strong> Mapear o estado da arte e entender quais problemas <em>podem</em> surgir ao adotar uma tecnologia emergente (ex.: vulnerabilidades em novos modelos de linguagem).</li>
</ul>
<h3 id="%F0%9F%93%8A-2-pesquisa-descritiva"><img class="emoji" draggable="false" alt="📊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ca.svg" data-marp-twemoji=""/> 2. Pesquisa Descritiva</h3>
<ul>
<li data-marpit-fragment="3"><strong>Conceito:</strong> Utilizada para mapear, mensurar e descrever as características de uma população ou sistema cujas variáveis já são conhecidas.</li>
<li data-marpit-fragment="4"><strong>Foco em IA:</strong> Descobrir a porcentagem exata de usuários afetados pelas alucinações da IA e em quais horários os picos de erro ocorrem.</li>
</ul>
<footer>Tipos, Abordagens e Delineamentos de Pesquisa</footer>

<h1 id="2-tipos-de-pesquisa-quanto-aos-objetivos-cont">2. Tipos de Pesquisa quanto aos Objetivos (Cont.)</h1>
<h3 id="%E2%9A%99%EF%B8%8F-3-pesquisa-explicativa"><img class="emoji" draggable="false" alt="⚙️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2699.svg" data-marp-twemoji=""/> 3. Pesquisa Explicativa</h3>

</ul>

<h1 id="3-abordagens-de-pesquisa-quali-quanti-ou-mista">3. Abordagens de Pesquisa: Quali, Quanti ou Mista?</h1>
<h3 id="%F0%9F%92%AC-abordagem-qualitativa-subjetiva--contextual"><img class="emoji" draggable="false" alt="💬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ac.svg" data-marp-twemoji=""/> Abordagem Qualitativa (Subjetiva / Contextual)</h3>
<ul>
<li data-marpit-fragment="1">Trata de percepções, sentimentos, textos e opiniões.</li>
<li data-marpit-fragment="2"><strong>Exemplo em IA:</strong> Entrevistar 10 clientes para entender a insatisfação com as respostas geradas e a perda de confiança na marca.</li>
</ul>
<h3 id="%F0%9F%94%A2-abordagem-quantitativa-objetiva--mensur%C3%A1vel"><img class="emoji" draggable="false" alt="🔢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f522.svg" data-marp-twemoji=""/> Abordagem Quantitativa (Objetiva / Mensurável)</h3>
<ul>
<li data-marpit-fragment="3">Trata de métricas numéricas, estatística e testes matemáticos.</li>
<li data-marpit-fragment="4"><strong>Exemplo em IA:</strong> Calcular a taxa de precisão, revocação (Recall) e a Matriz de Confusão do modelo.</li>
</ul>
<h3 id="%F0%9F%94%84-abordagem-mista-triangula%C3%A7%C3%A3o-de-dados"><img class="emoji" draggable="false" alt="🔄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f504.svg" data-marp-twemoji=""/> Abordagem Mista (Triangulação de Dados)</h3>
<ul>
<li data-marpit-fragment="5">Unifica dados numéricos com o contexto qualitativo.</li>
<li data-marpit-fragment="6"><strong>O Poder da Combinada:</strong> Provar numericamente que a precisão caiu para 60% (<em>Quanti</em>) e entender o impacto disso na experiência do cliente através das entrevistas (<em>Quali</em>).</li>
</ul>
<footer>Tipos, Abordagens e Delineamentos de Pesquisa</footer>
</section>

<header>Investigação Científica e Tecnológica | Aula Integrada</header>
<h1 id="4-conceito-de-delineamento-de-pesquisa">4. Conceito de Delineamento de Pesquisa</h1>
<h3 id="o-que-%C3%A9-um-delineamento">O Que É um Delineamento?</h3>
<ul>
<li data-marpit-fragment="1">É o <strong>desenho prático do estudo</strong>: define como você irá estruturar a coleta e a análise das evidências no mundo real.</li>
<li data-marpit-fragment="2">Conecta a pergunta hipotética ao banco de dados ou ao ambiente de testes.</li>
</ul>
<h3 id="tipos-de-fontes-de-informa%C3%A7%C3%A3o">Tipos de Fontes de Informação</h3>
<ul>
<li data-marpit-fragment="3"><strong>Fontes Primárias:</strong> Dados brutos gerados pela sua própria investigação (ex.: logs gerados em um teste A/B, respostas de formulários).</li>
<li data-marpit-fragment="4"><strong>Fontes Secundárias:</strong> Dados que já foram coletados, processados e publicados por outros pesquisadores ou instituições (ex.: datasets públicos do Kaggle, artigos da IEEE).</li>
</ul>

<h1 id="8-oficina-pr%C3%A1tica-orientada-em-sala-55-min">8. Oficina Prática Orientada em Sala (55 min)</h1>
<h3 id="o-desafio-dos-grupos">O Desafio dos Grupos:</h3>
<ol>
<li>Formem grupos de <strong>3 a 4 alunos</strong>.</li>
<li>Cada grupo deve escolher um problema técnico real em IA (ex.: <em>viés no recrutamento automatizado</em>, <em>queda na acurácia do modelo de fraude</em>, <em>alucinação em chatbot jurídico</em>).</li>
<li>Preencham a <strong>Matriz Metodológica Integrada</strong> estruturando a solução do problema.</li>
<li>Garantam que haja coerência: o delineamento escolhido DEVE ser capaz de responder ao objetivo traçado.</li>
</ol>
